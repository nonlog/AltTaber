name: Build and Release

on:
  push:
    branches:
      - master
      - thumbnail-preview
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: cmake --build build --parallel

      - name: Package
        shell: pwsh
        run: |
          $dist = Join-Path $PWD "dist\AltTaber"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item "build\AltTaber.exe" $dist
          windeployqt --release --no-translations --dir $dist (Join-Path $dist "AltTaber.exe")
          Copy-Item "README.md" $dist
          Compress-Archive -Path "$dist\*" -DestinationPath "dist\AltTaber-0.6.0-win64.zip" -Force
          Get-FileHash "dist\AltTaber-0.6.0-win64.zip" -Algorithm SHA256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltTaber-0.6.0-win64
          path: dist/AltTaber-0.6.0-win64.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AltTaber-0.6.0-win64.zip
          generate_release_notes: true
          body: |
            Fork release focused on a Windows 11-style per-window Alt+Tab view.

            - Uses DWM live thumbnails for individual windows.
            - Keeps AltTaber's own low-level Alt+Tab hook, avoiding the native Windows 11 task switcher path that can corrupt Microsoft Pinyin per-window Chinese/English state.
            - Falls back to the app icon when a DWM thumbnail cannot be registered.
